<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17171d"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#241443"/>
      <stop offset="0.30" stop-color="#7e2f74"/>
      <stop offset="0.56" stop-color="#d75775"/>
      <stop offset="0.78" stop-color="#f3925e"/>
      <stop offset="1"    stop-color="#f9c47c"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ffe7ae" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffab6b" stop-opacity="0.38"/>
      <stop offset="1"   stop-color="#ff8a66" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c2f66"/>
      <stop offset="1" stop-color="#201234"/>
    </linearGradient>

    <g id="scene">
      <rect x="56" y="168" width="400" height="176" fill="url(#sky)"/>
      <ellipse cx="256" cy="292" rx="168" ry="96" fill="url(#sunglow)"/>
      <circle cx="256" cy="286" r="26" fill="#fff6dc"/>
      <path d="M 56,300 L 104,250 L 142,288 L 190,238 L 232,282 L 274,236 L 322,290 L 372,246 L 420,296 L 456,266 L 456,344 L 56,344 Z" fill="#8a3f85" opacity="0.9"/>
      <path d="M 56,318 L 100,288 L 150,322 L 200,282 L 248,320 L 300,284 L 352,322 L 404,290 L 456,320 L 456,344 L 56,344 Z" fill="#4b2a5e"/>
      <rect x="56" y="322" width="400" height="22" fill="url(#lake)"/>
      <rect x="238" y="322" width="36" height="22" fill="#ffd9a0" opacity="0.30"/>
    </g>

    <clipPath id="p0"><rect x="56"  y="168" width="124" height="176" rx="9"/></clipPath>
    <clipPath id="p1"><rect x="194" y="168" width="124" height="176" rx="9"/></clipPath>
    <clipPath id="p2"><rect x="332" y="168" width="124" height="176" rx="9"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#34343e" stroke-width="3"/>

  <g clip-path="url(#p0)"><use href="#scene"/></g>
  <g clip-path="url(#p1)"><use href="#scene"/></g>
  <g clip-path="url(#p2)"><use href="#scene"/></g>

  <g fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="3">
    <rect x="56"  y="168" width="124" height="176" rx="9"/>
    <rect x="194" y="168" width="124" height="176" rx="9"/>
    <rect x="332" y="168" width="124" height="176" rx="9"/>
  </g>
</svg>
